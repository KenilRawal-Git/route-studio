name: Refresh timetables and stops
on:
  schedule:
    - cron: "17 4 * * 1"      # every Monday at about 04:17 UTC, after BODS publishes its daily files
  workflow_dispatch: {}         # "Run workflow" button on GitHub for an update right away
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/refresh.py
      - name: Save the new data
        run: |
          git config user.name "route-studio-bot"
          git config user.email "route-studio-bot@users.noreply.github.com"
          git add bods naptan
          git diff --cached --quiet || git commit -m "Weekly refresh: BODS timetables and NaPTAN stops"
          git push
